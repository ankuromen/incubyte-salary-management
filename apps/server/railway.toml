# Railway config — set service Root Directory to apps/server in the dashboard
# Docs: https://docs.railway.com/reference/config-as-code

[build]
builder = "nixpacks"
# Nixpacks runs `npm ci` first — use Node 22 (see nixpacks.toml); keep package-lock.json in sync
buildCommand = "npm run prisma:generate && npm run build"

[deploy]
# Seed must run here (not pre-deploy): volumes are mounted only at container start.
startCommand = "mkdir -p /data && npm run seed && npm run start:prod"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
