# Nixpacks config for Railway — Prisma 7 requires Node 20.19+
# https://nixpacks.com/docs/guides/configuring-builds

[phases.setup]
nixPkgs = ["nodejs_22", "openssl"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run prisma:generate", "npm run build"]

[start]
cmd = "npm run start:prod"
